<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教學練習平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fef9f0;
      --bg-soft: radial-gradient(1100px 550px at 10% -10%, #d6f3ff 0%, transparent 55%),
                 radial-gradient(900px 500px at 100% 0%, #fff0d2 0%, transparent 50%),
                 #fefaf2;
      --surface: #ffffff;
      --surface-2: #fff4de;
      --surface-hover: #fff0d2;
      --border: rgba(70,50,20,.10);
      --border-strong: rgba(70,50,20,.22);
      --text: #3a3450;
      --muted: #837da0;
      --dim: #c3bcdb;
      --accent: #ff8a3d;
      --accent-2: #ff5d8f;
      --accent-grad: linear-gradient(135deg, #ffb648 0%, #ff7a59 55%, #ff5d8f 100%);
      --accent-glow: 0 0 0 3px rgba(255,138,61,.3);
      --ok-bg: #e3f9e7;   --ok-text: #1f9d55;   --ok-border: #a7e8b8;
      --wait-bg: #fff3d2; --wait-text: #b9790a; --wait-border: #ffdd8f;
      --pre-bg: #e2f0ff;  --pre-text: #1c74d4;  --pre-border: #aed6ff;
      --post-bg: #f6e3ff; --post-text: #9b34c9; --post-border: #e2b8ff;
      --danger: #e5484d;
      --danger-bg: #ffe4e5;
      --radius: 18px;
      --shadow: 0 2px 6px rgba(255,138,61,.10), 0 12px 28px -16px rgba(255,93,143,.35);
    }
    * { box-sizing: border-box; }
    ::selection { background: rgba(255,138,61,.35); }
    body {
      margin: 0;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg-soft);
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      letter-spacing: .1px;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

    header.bar {
      background: var(--accent-grad);
      color: #fff; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 10px rgba(255,93,143,.25);
    }
    header.bar .brand { font-weight: 800; font-size: 17px; letter-spacing: .3px; color: #fff; }
    header.bar .who { font-size: 13.5px; color: rgba(255,255,255,.92); display: flex; gap: 12px; align-items: center; }
    header.bar .who a { color: rgba(255,255,255,.85) !important; opacity: .95; }
    header.bar .who a:hover { color: #fff !important; }

    button {
      font: inherit; font-weight: 700; cursor: pointer; border: 1px solid transparent; border-radius: 12px;
      padding: 10px 18px; background: var(--accent-grad); color: #fff;
      box-shadow: 0 4px 14px -6px rgba(255,93,143,.55);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease, opacity .12s ease;
    }
    button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.ghost {
      background: rgba(70,50,20,.05); color: var(--text);
      border: 1px solid var(--border); box-shadow: none;
    }
    button.ghost:hover { background: rgba(70,50,20,.10); border-color: var(--border-strong); }
    button.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #ffc2c4; box-shadow: none; }
    button.danger:hover { background: #ffd3d5; }
    button:disabled { opacity: .45; cursor: default; transform: none; filter: none; }

    input, textarea, select {
      font: inherit; width: 100%; padding: 10px 13px; border: 1px solid var(--border);
      border-radius: 12px; background: #fffdf8; color: var(--text); margin-top: 6px;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--accent-glow);
    }
    input[type=date] { color-scheme: light; }
    input[type=radio], input[type=checkbox] { accent-color: var(--accent); }

    label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .2px; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; margin-top: 16px; box-shadow: var(--shadow);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .tag {
      font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
      background: rgba(70,50,20,.06); color: var(--muted); border: 1px solid var(--border);
      white-space: nowrap;
    }
    .tag.ok   { background: var(--ok-bg);   color: var(--ok-text);   border-color: var(--ok-border); }
    .tag.wait { background: var(--wait-bg); color: var(--wait-text); border-color: var(--wait-border); }
    .tag.pre  { background: var(--pre-bg);  color: var(--pre-text);  border-color: var(--pre-border); }
    .tag.post { background: var(--post-bg); color: var(--post-text); border-color: var(--post-border); }

    .muted { color: var(--muted); font-size: 13px; }
    .err {
      color: var(--danger); font-size: 13.5px; margin-top: 10px; padding: 9px 12px;
      background: var(--danger-bg); border: 1px solid #ffc2c4; border-radius: 10px;
    }

    h1 { font-size: 24px; font-weight: 800; letter-spacing: .1px; margin: 0 0 4px; }
    h2 { font-size: 17px; font-weight: 700; margin: 0 0 4px; }

    .tabs { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .tabs button {
      background: rgba(70,50,20,.05); color: var(--muted); border: 1px solid var(--border);
      box-shadow: none; font-size: 13.5px; padding: 9px 16px;
    }
    .tabs button.active {
      background: var(--accent-grad); color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px -6px rgba(255,93,143,.55);
    }
    .tabs button.active:hover { filter: brightness(1.06); }

    .choice {
      display: flex; gap: 10px; align-items: center; margin-top: 8px;
      padding: 8px 10px; border-radius: 10px; transition: background .12s ease;
    }
    .choice:hover { background: rgba(70,50,20,.04); }
    .choice input[type=radio], .choice input[type=checkbox] { width: auto; margin: 0; transform: scale(1.1); }

    .chip {
      font-size: 12.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
      background: rgba(70,50,20,.05); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .chip:hover { background: rgba(70,50,20,.10); color: var(--text); }
    .chip.active {
      background: var(--accent-grad); color: #fff; border-color: transparent;
    }

    .role-card {
      cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 20px; transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .role-card:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--surface-hover); }
    .role-card h2 { font-size: 17px; }
    .role-card p { margin: 4px 0 0; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(70,50,20,.18); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(70,50,20,.3); }

    /* ================================================================
       改版：學習冒險地圖 —— 動畫與新元件
       ================================================================ */
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes popIn    { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.07); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes floaty   { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    @keyframes pulseRing{ 0% { box-shadow: 0 0 0 0 rgba(255,122,89,.6); } 70% { box-shadow: 0 0 0 18px rgba(255,122,89,0); } 100% { box-shadow: 0 0 0 0 rgba(255,122,89,0); } }
    @keyframes starPop  { 0% { opacity: 0; transform: scale(0) rotate(-45deg); } 60% { transform: scale(1.4) rotate(10deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes waveHand { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }
    @keyframes confetti { 0% { opacity: 1; transform: translate3d(0,-10vh,0) rotate(0); } 100% { opacity: 1; transform: translate3d(var(--dx),108vh,0) rotate(var(--rot)); } }
    @keyframes stripes  { from { background-position: 0 0; } to { background-position: 40px 0; } }
    @keyframes bubbleBob{ 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); } }
    @keyframes shake    { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes drift    { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, -30px) scale(1.08); } }
    @keyframes checkPop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* 背景漂浮的彩色光球 */
    body::before, body::after {
      content: ''; position: fixed; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(60px); opacity: .5;
    }
    body::before { width: 360px; height: 360px; left: -100px; top: 30%; background: #ffd6a5; animation: drift 14s ease-in-out infinite; }
    body::after  { width: 320px; height: 320px; right: -90px; top: 8%;  background: #bde8ff; animation: drift 17s ease-in-out infinite reverse; }

    /* 每個頁面進來時，內容一塊一塊往上浮出（view 切換會重新掛載 .wrap，所以每次換頁都會播） */
    .wrap > * { animation: fadeUp .55s cubic-bezier(.22,1,.36,1) backwards; }
    .wrap > *:nth-child(1) { animation-delay: 0s; }
    .wrap > *:nth-child(2) { animation-delay: .07s; }
    .wrap > *:nth-child(3) { animation-delay: .14s; }
    .wrap > *:nth-child(4) { animation-delay: .21s; }
    .wrap > *:nth-child(5) { animation-delay: .28s; }
    .wrap > *:nth-child(6) { animation-delay: .35s; }
    .wrap > *:nth-child(n+7) { animation-delay: .42s; }

    button:active { transform: scale(.96); }
    .err { animation: shake .45s; }
    .lift { transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s; }
    .lift:hover { transform: translateY(-4px); box-shadow: 0 4px 10px rgba(255,138,61,.14), 0 18px 34px -16px rgba(255,93,143,.45); }

    header.bar .brand .mascot-sm { display: inline-block; animation: waveHand 3.4s ease-in-out infinite; transform-origin: 70% 80%; }
    .mascot { display: inline-block; animation: floaty 3.2s ease-in-out infinite; transform-origin: 50% 85%; }
    .mascot.big { font-size: 54px; line-height: 1; filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); }
    .wave { display: inline-block; animation: waveHand 2.4s ease-in-out infinite; transform-origin: 70% 75%; }

    .hero { background: var(--accent-grad); color: #fff; border: none; position: relative; overflow: hidden; }
    .hero::after { content: ''; position: absolute; right: -50px; bottom: -70px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.14); pointer-events: none; }
    .stat-pill { background: rgba(255,255,255,.24); border-radius: 14px; padding: 8px 16px; animation: popIn .5s cubic-bezier(.22,1,.36,1) backwards; }
    .mission { margin-top: 12px; display: inline-block; background: rgba(255,255,255,.26); padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; animation: popIn .5s .25s backwards; }
    .section-title { margin: 26px 0 4px; font-size: 19px; }

    /* 小島（課程）卡片 */
    .islands { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 12px; }
    .island {
      position: relative; overflow: hidden; cursor: pointer; color: #fff; padding: 20px; border-radius: 26px;
      background: var(--island-bg); box-shadow: 0 10px 24px -12px rgba(0,0,0,.35);
      transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
      animation: popIn .55s cubic-bezier(.22,1,.36,1) backwards;
    }
    .island::after { content: ''; position: absolute; right: -36px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.18); pointer-events: none; }
    .island:hover { transform: translateY(-6px) rotate(-.6deg); box-shadow: 0 20px 36px -14px rgba(0,0,0,.4); }
    .island:active { transform: scale(.98); }
    .island h2 { color: #fff; font-size: 19px; margin: 12px 0 4px; }
    .island .meta { font-size: 13px; opacity: .95; }
    .island-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .island .emoji { font-size: 44px; line-height: 1; display: inline-block; animation: floaty 4s ease-in-out infinite; }
    .island-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; position: relative; z-index: 1; }
    .island .go { font-weight: 800; background: rgba(255,255,255,.28); padding: 6px 14px; border-radius: 999px; transition: transform .2s; }
    .island:hover .go { transform: translateX(4px); }
    .island-leave { background: transparent; border: none; box-shadow: none; color: rgba(255,255,255,.8); font-size: 12px; padding: 4px 6px; font-weight: 600; text-decoration: underline; }
    .island-leave:hover { color: #fff; filter: none; transform: none; }
    .ring { position: relative; display: inline-block; flex: none; }
    .ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
    .big-score { font-size: 34px; font-weight: 800; }

    .empty { text-align: center; padding: 30px 20px; }
    .empty p { margin: 8px 0 0; color: var(--muted); }
    .join { margin-top: 22px; }

    /* 課程頁：標題區、進度條 */
    .course-hero { background: var(--island-bg); }
    .emoji-xl { font-size: 62px; line-height: 1; animation: floaty 4s ease-in-out infinite; position: relative; z-index: 1; }
    .pbar { height: 14px; border-radius: 999px; background: rgba(255,255,255,.32); overflow: hidden; margin-top: 8px; position: relative; z-index: 1; }
    .pbar > i {
      display: block; height: 100%; border-radius: 999px; width: 0;
      background: repeating-linear-gradient(135deg, #fff 0 10px, rgba(255,255,255,.78) 10px 20px); background-size: 40px 100%;
      animation: stripes 1s linear infinite; transition: width 1.1s cubic-bezier(.22,1,.36,1);
    }
    .pbar.live { background: rgba(70,50,20,.10); }
    .pbar.live > i { background: repeating-linear-gradient(135deg, #ff8a3d 0 10px, #ff5d8f 10px 20px); background-size: 40px 100%; transition-duration: .5s; }
    .flash { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text); font-weight: 700; animation: popIn .5s backwards; }
    .filters { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .chip { user-select: none; }
    .chip:active { transform: scale(.94); }
    .chip.active { animation: popIn .3s; }

    /* 關卡路徑 */
    .quest { position: relative; margin-top: 18px; }
    .quest::before { content: ''; position: absolute; left: 33px; top: 20px; bottom: 20px; border-left: 4px dotted rgba(70,50,20,.2); z-index: 0; }
    .quest-row { display: flex; gap: 16px; align-items: center; position: relative; padding: 6px 0; animation: fadeUp .55s cubic-bezier(.22,1,.36,1) backwards; }
    .quest-card { flex: 1; margin-top: 0; min-width: 0; }
    .node {
      flex: none; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
      font-size: 26px; font-weight: 800; color: #fff; border: 5px solid #fff; box-shadow: var(--shadow);
      animation: popIn .55s cubic-bezier(.22,1,.36,1) backwards;
    }
    .node.todo { background: var(--accent-grad); animation: popIn .55s backwards, pulseRing 1.9s 1s infinite; }
    .node.done { background: linear-gradient(135deg, #3ed598, #1f9d55); }
    .node.wait { background: linear-gradient(135deg, #ffd166, #f4a300); }
    .node .bubble {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%); white-space: nowrap;
      background: #3a3450; color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; animation: bubbleBob 1.4s ease-in-out infinite;
    }
    .node .bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #3a3450; border-bottom: 0; }
    .stars { display: inline-flex; gap: 2px; }
    .stars > span { display: inline-block; animation: starPop .55s cubic-bezier(.22,1,.36,1) backwards; animation-delay: calc(var(--i) * .17s + .35s); }
    .stars > span.off { filter: grayscale(1) opacity(.3); }

    /* 作答頁 */
    .quiz-progress { position: sticky; top: 64px; z-index: 6; background: rgba(255,253,248,.92); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-top: 16px; box-shadow: var(--shadow); }
    .q-card { animation: fadeUp .55s cubic-bezier(.22,1,.36,1) backwards; border: 2px solid transparent; transition: border-color .25s, background .25s; }
    .q-card.answered { border-color: var(--ok-border); }
    .q-badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-grad); color: #fff; font-weight: 800; }
    .q-check { color: var(--ok-text); font-weight: 800; animation: checkPop .4s; }
    .q-icon { font-size: 20px; animation: checkPop .5s; }
    .q-text { white-space: pre-wrap; font-size: 17px; font-weight: 600; margin: 10px 0 8px; }
    .opt {
      display: flex; align-items: center; gap: 12px; cursor: pointer; margin-top: 10px; padding: 12px 14px; border-radius: 16px;
      border: 2px solid var(--border); background: #fffdf8; transition: transform .18s cubic-bezier(.22,1,.36,1), border-color .18s, background .18s, box-shadow .18s;
    }
    .opt:hover { border-color: var(--accent); transform: translateX(4px); }
    .opt.selected { border-color: var(--accent); background: #fff1e0; box-shadow: 0 6px 16px -8px rgba(255,122,89,.6); animation: popIn .28s; }
    .opt input { width: auto; margin: 0; flex: none; transform: scale(1.25); }
    .opt-key { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; background: rgba(70,50,20,.07); color: var(--muted); }
    .opt.selected .opt-key { background: var(--accent-grad); color: #fff; }
    .big-btn { width: 100%; font-size: 18px; padding: 15px; border-radius: 16px; }
    .teacher-note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
    .score-hero { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .score-hero > * { position: relative; z-index: 1; }

    .loading { display: flex; align-items: center; gap: 10px; justify-content: center; color: var(--muted); padding: 40px 0; }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,138,61,.25); border-top-color: var(--accent); animation: spin .8s linear infinite; }

    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 100; }
    .confetti-wrap > i { position: absolute; top: 0; border-radius: 2px; animation: confetti 3s ease-in forwards; }

    @media (max-width: 520px) {
      .node { width: 56px; height: 56px; font-size: 22px; }
      .quest::before { left: 27px; }
      .quest-row { gap: 10px; }
      .islands { grid-template-columns: 1fr; }
    }

    /* 有些人開了「減少動態效果」，尊重他們的設定：動畫幾乎直接跳到結果 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }

    /* 試玩帳號提示框 */
    .demo-box { border: 2px dashed var(--accent); background: #fffaf0; animation: popIn .5s .2s backwards; }
    .demo-title { font-weight: 800; margin-bottom: 10px; }
    .demo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13.5px; }
    .demo-row > span { flex: none; width: 44px; color: var(--muted); font-weight: 700; }
    .demo-row code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: rgba(255,138,61,.12); border-radius: 8px; padding: 4px 8px; font-family: ui-monospace, Consolas, monospace; user-select: all; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <script type="text/babel" src="/app.js"></script>
</body>
</html>
